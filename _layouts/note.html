---
layout: default
---
<article class="article-shell note-shell">
  <header class="article-header">
    <div class="eyebrow">Research Note</div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description }}</p>{% endif %}
    <div class="article-meta"><time>{{ page.date | date: "%B %d, %Y" }}</time></div>
    {% if page.tags %}<div class="tag-list">{% for tag in page.tags %}<span>#{{ tag }}</span>{% endfor %}</div>{% endif %}
  </header>
  <div class="article-grid">
    <div class="prose" id="article-content">{{ content }}</div>
    <aside class="toc-wrap"><div class="toc-title">Contents</div><nav id="toc"></nav></aside>
  </div>
</article>
